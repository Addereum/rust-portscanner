[package]
name = "portscanner"
version = "0.1.0"
edition = "2024"
authors = ["Lukas Roß <contact@lukas-ross.de>"]
description = "Fast port scanner with TUI, export and more"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/Addereum/rust-portscanner"
homepage = "https://lukas-ross.de"
keywords = ["portscanner", "network", "tui", "cli"]
categories = ["command-line-utilities"]
exclude = ["/target", "/.git"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.8"
colored = "2"
ratatui = "0.26"
crossterm = "0.27"
zip = "0.6"
num_cpus = "1.16"
chrono = "0.4.42"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net"] }
ipnet = "2"
futures = "0.3"
anyhow = "1.0"

[package.metadata.deb]
name = "rust-portscanner"
maintainer = "Lukas Roß <contact@lukas-ross.de>"
section = "utils"
priority = "optional"
depends = ["libc6 (>= 2.27)"]
provides = ["portscanner"]
conflicts = []
replaces = []
license-file = "LICENSE"
